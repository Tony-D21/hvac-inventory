<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HVAC INVENTORY</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body>

    <header class="d-flex align-items-center p-3" style="background-color: #0b1f3a">
        <a href="{{ url_for('main.home') }}">
            <img src="{{ url_for('static', filename='img/logo2_marvi.png') }}"alt="Logo de la empresa"width="70" height="auto">
        </a>
        <h1 class="col-3 text-white ms-2">Marvi Confort</h1>

    </header>

    <main class="container-fluid g-0">
        <section class="d-flex">         
                <nav class="p-3 min-vh-100 flex-shrink-0" style="width: 280px; background-color: #0b1f3a;">
                    <ul class="nav nav-pills flex-column gap-2">
                        <li class="d-flex align-items-center gap-2 mb-4"><!--Mandamos el texto de lado derecho y icono del lado izquierdo-->
                            <img src="{{ url_for('static', filename= 'img/inventario.png') }}" alt="Logo inventario" width="30" height="auto">
                            <a href="{{ url_for('main.inventario') }}" class="nav-link text-white">Inventario</a>
                        </li>

                        <li class="d-flex align-items-center gap-2 mb-4">
                            <img src="{{ url_for('static', filename= 'img/entradas.png') }}" alt="Logo inventario" width="30" height="auto">
                            <a href="/entrada" class="nav-link text-white">Entradas</a>
                        </li>

                        <li class="d-flex align-items-center gap-2 mb-4">
                            <img src="{{ url_for('static', filename= 'img/salidas.png') }}" alt="Logo inventario" width="30" height="auto">
                            <a href="/salidas" class="nav-link text-white">Salidas</a>
                        </li>

                        <li class="d-flex align-items-center gap-2 mb-4">
                            <img src="{{ url_for('static', filename= 'img/almacenes.png') }}" alt="Logo inventario" width="30" height="auto">
                            <a href="/almacenes" class="nav-link text-white">Almacenes</a>
                        </li>

                        <li class="d-flex align-items-center gap-2 mb-4">
                            <img src="{{ url_for('static', filename= 'img/reportes.png') }}" alt="Logo inventario" width="30" height="auto">
                            <a href="/reportes" class="nav-link text-white">Reportes</a>
                        </li>

                        <li class="d-flex align-items-center gap-2">
                            <img src="{{ url_for('static', filename= 'img/historiales.png') }}" alt="Logo inventario" width="30" height="auto">
                            <a href="/historial" class="nav-link text-white">Historial</a>
                        </li>
                    </ul>
                </nav>

            <section class="flex-grow-1 p-4">
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        {% for messages in messages %}
                        <div class="alert alert-warning" role="alert">
                            {{messages}}
                        </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                {% block content %}
                {% endblock %}
            </section>

        </section>

    </main>

</body>
</html>
